name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        env:
          DATABASE_URL: postgresql://neondb_owner:npg_VybRIn0Wgwu4@ep-lingering-bar-b5w4ulgq-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
          JWT_ACCESS_SECRET: super_secret_access_key_mobile_poi_2026
          JWT_REFRESH_SECRET: super_secret_refresh_key_mobile_poi_2026
        run: npm test

      - name: Build Docker image
        run: docker build -t tour-guide-backend-ci-test .
