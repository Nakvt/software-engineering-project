name: Mobile CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "mobile-gps/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [develop, main, "feature/**"]
    paths:
      - "mobile-gps/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  mobile:
    name: Type check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-gps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-gps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
