services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: tour-guide-postgis
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in backend/.env}
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
